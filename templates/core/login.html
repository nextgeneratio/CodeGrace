{% extends 'base.html' %}
{% block title %}Login - CodeGrace{% endblock %}
{% block content %}
<div style="max-width:400px; margin:3rem auto;">
    <div class="card">
        <h2 style="margin-bottom:1.5rem; color:#1a1a2e;">Login</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div style="margin-bottom:1rem;">
                <label style="display:block; margin-bottom:0.3rem; font-weight:bold;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p style="color:#e94560; font-size:0.85rem;">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">Login</button>
        </form>
        <p style="margin-top:1rem; text-align:center; color:#666;">Don't have an account? <a href="{% url 'register' %}" style="color:#e94560;">Register</a></p>
    </div>
</div>
{% endblock %}
